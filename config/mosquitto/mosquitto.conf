# Eclipse Mosquitto 2.x — DEVELOPMENT ONLY.
# No TLS and no authentication (documented limitation, see docs/ingestion_ops.md).
# Exposure is limited by binding: inside Docker the listener is on all container
# interfaces, but docker-compose publishes the port on 127.0.0.1 only.
# For a native (non-Docker) install use config/mosquitto/mosquitto.native.conf.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

max_queued_messages 10000
