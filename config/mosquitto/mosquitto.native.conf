# Eclipse Mosquitto 2.x native install (Windows service / Homebrew) — DEVELOPMENT ONLY.
# Listener bound to loopback, so anonymous access is local-only.
# Run from the project root:  mosquitto -c config/mosquitto/mosquitto.native.conf -v
listener 1883 127.0.0.1
allow_anonymous true

persistence true
persistence_location ./results/mosquitto-data/
autosave_interval 30

log_type error
log_type warning
log_type notice
log_type information
connection_messages true
max_queued_messages 10000
