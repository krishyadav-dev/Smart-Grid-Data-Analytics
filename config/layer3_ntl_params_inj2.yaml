b1_rule: 'update: at the start of each scored month M, the online days of M - 1 the
  current model classified benign join the benign set; their attack patterns (fold''s
  training attacks, child stream 20 + month of rng 20261027) join the attack set;
  scaling, k-means rule and SVC (frozen C, gamma) refitted [our choice: Jokar step
  4 without its DT condition]'
day_score: SVC decision_function (ovr), malicious class column
household_score: share of online scored days flagged (predicted class = malicious)
flag_rule: household flagged if score >= q
kmeans:
  k_range:
  - 2
  - 3
  - 4
  rule: 'argmax mean silhouette; ties: smaller k'
  min_cluster_share: 0.05
  random_state: 20261027
min_train_days: 30
seed: 20261027
grid:
