# Stage 3 step C: frozen before any May-December forecast (run sheet §4)
lstm:
  variant: residual
  layers: 1
  units: 64
  dropout: 0.1
  n_parameters: 29792
  lookback_steps: 672
  horizon_steps: 96
  april_mean_hot_spot_rmse_k: 0.773188
training:
  loss: 'MSE on the variant''s target (direct: K_p; residual: K_p(D) - K_p(D-1), equal
    to the K_p error before clipping)'
  optimizer: adam
  lr: 0.001
  batch: 256
  max_epochs: 50
  patience: 5
  val_days: 14
  gap_days: 15
  data_start: '2024-01-02'
  negative_forecasts: clipped at 0
seeds:
- 20261028
- 20261029
- 20261030
grid:
  variants:
  - direct
  - residual
  layers:
  - 1
  - 2
  units:
  - 32
  - 64
  - 128
tuned_on:
  window: train 2024-01-02..2024-03-17 (first target 2024-01-09), early stopping 2024-03-18..2024-03-31,
    origins 2024-04-01..2024-04-30
  criterion: lowest mean over the 13 DTs of the hot-spot RMSE over all April origins
    x 96 steps (seed-mean forecast, main parameter set) across the 12 candidates (6
    direct + 6 residual); tie-break fewer parameters
walk_forward:
  retrain: monthly, at the first origin of each month
  test_origins: 2024-05-01..2024-12-30
thermal:
  dt_min: 0.1
  substeps: 150
  param_sets:
  - main
  - table_e1
