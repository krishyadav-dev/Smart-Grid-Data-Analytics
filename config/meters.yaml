# Meter inventory.  Checked against feeder_model.meter_points() and the live
# server by tests/ingestion/test_config_contract.py.
# unit_id follows meter_server._load_id_unit_map() (order of meter_points()):
#   1-9 load points (bus_virtual), 10 feeder head, 11-23 DT meters (Part 2C.3, 13 DTs after brief v2 X.3).
# v_base_ln_v = vn_kv * 1000 / sqrt(3) of the bus the meter reads, from
#   feeder_model.build_network("B"): DT LV buses 0.433 kV (IS 1180 Cl. 6.5/7.5),
#   feeder head 11 kV.  A bus_virtual meter reads its DTs' LV side.
# i_rated_a: DT meters = DT rated LV current S_r / (sqrt(3) x 433 V) (IS 1180
#   rating); null where Layer 1 has no rating (bus_virtual, feeder head).
# role: bus_virtual = sum of the bus's DT meters (with their errors); no meter error
#   of its own; not a physical meter and excluded from meter counts and accuracy
#   claims; kept for Layer 2 compatibility (schema 2.0).  feeder_head and dt are
#   physical meters, class 0.5S (CEA Metering Regulations, 2019 amendment).
#   Consumer meters (class 1.0) are not polled; they go to the AMI export.
